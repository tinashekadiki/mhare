# Author: Tinashe K
# Single-origin eMhare edge routing. Keep precedence in this order.

upstream emhare_api_gateway {
    server api-gateway:8080;
}

upstream emhare_student_portal {
    server student-portal:3000;
}

upstream emhare_applicant_portal {
    server applicant-portal:3000;
}

upstream emhare_staff_portal {
    server admin-portal:3000;
}

server {
    listen 80;
    server_name _;

    location ^~ /api/ {
        proxy_pass http://emhare_api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /applicant { return 308 /applicant/; }
    location ^~ /applicant/ {
        proxy_pass http://emhare_applicant_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /staff { return 308 /staff/; }
    location ^~ /staff/ {
        proxy_pass http://emhare_staff_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /student {
        proxy_pass http://emhare_student_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /student/ {
        proxy_pass http://emhare_student_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(news|notices|events|campaigns)/ {
        proxy_pass http://emhare_student_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://emhare_student_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
