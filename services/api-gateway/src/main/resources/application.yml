server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8099/realms/emhare}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      server:
        webmvc:
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins:
                  - "http://localhost:3000"
                  - "http://localhost:3001"
                  - "http://localhost:3002"
                  - "http://localhost:3100"
                  - "http://localhost:3101"
                  - "http://localhost:3102"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - X-Requested-With
                exposed-headers:
                  - Location
                allow-credentials: true
          routes:
            - id: core-identity-service
              uri: lb://core-identity-service
              predicates:
                - Path=/api/core/**,/api/identity/**
            - id: academic-setup-service
              uri: lb://academic-setup-service
              predicates:
                - Path=/api/academic/**
            - id: admissions-service
              uri: lb://admissions-service
              predicates:
                - Path=/api/admissions/**,/api/applicant/**
            - id: finance-service
              uri: lb://finance-service
              predicates:
                - Path=/api/finance/**
            - id: student-records-service
              uri: lb://student-records-service
              predicates:
                - Path=/api/student-records/**,/api/students/**,/api/registration/**
            - id: assessment-results-service
              uri: lb://assessment-results-service
              predicates:
                - Path=/api/assessment/**,/api/results/**,/api/assessment-results/**
            - id: exams-timetabling-service
              uri: lb://exams-timetabling-service
              predicates:
                - Path=/api/exams/**,/api/timetabling/**
            - id: accommodation-service
              uri: lb://accommodation-service
              predicates:
                - Path=/api/accommodation/**
            - id: dining-service
              uri: lb://dining-service
              predicates:
                - Path=/api/dining/**
            - id: documents-reporting-service
              uri: lb://documents-reporting-service
              predicates:
                - Path=/api/documents/**,/api/reports/**
            - id: notifications-service
              uri: lb://notifications-service
              predicates:
                - Path=/api/notifications/**
            - id: communications-service
              uri: lb://communications-service
              predicates:
                - Path=/api/communications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    healthcheck:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://emhare-discovery:emhare-discovery-dev@localhost:8761/eureka/}
  instance:
    instance-id: ${spring.application.name}:${SERVER_PORT:${server.port}}:${random.value}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

emhare:
  gateway:
    service-topology:
      enabled: ${GATEWAY_SERVICE_TOPOLOGY_ENABLED:true}
      expected-service-ids:
        - core-identity-service
        - academic-setup-service
        - admissions-service
        - finance-service
        - student-records-service
        - assessment-results-service
        - exams-timetabling-service
        - accommodation-service
        - dining-service
        - documents-reporting-service
        - notifications-service
        - communications-service

logging:
  structured:
    format:
      console: ${EMHARE_STRUCTURED_LOG_FORMAT:logstash}
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
