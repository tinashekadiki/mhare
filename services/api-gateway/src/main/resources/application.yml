server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8099/realms/emhare}
  cloud:
    gateway:
      server:
        webmvc:
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins:
                  - "http://localhost:3000"
                  - "http://localhost:3001"
                  - "http://localhost:3002"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - X-Requested-With
                exposed-headers:
                  - Location
                allow-credentials: true
          routes:
            - id: core-identity-service
              uri: ${emhare.gateway.upstream-health.services.core-identity}
              predicates:
                - Path=/api/core/**,/api/identity/**
            - id: academic-setup-service
              uri: ${emhare.gateway.upstream-health.services.academic-setup}
              predicates:
                - Path=/api/academic/**
            - id: admissions-service
              uri: ${emhare.gateway.upstream-health.services.admissions}
              predicates:
                - Path=/api/admissions/**,/api/applicant/**
            - id: finance-service
              uri: ${emhare.gateway.upstream-health.services.finance}
              predicates:
                - Path=/api/finance/**
            - id: student-records-service
              uri: ${emhare.gateway.upstream-health.services.student-records}
              predicates:
                - Path=/api/student-records/**,/api/students/**,/api/registration/**
            - id: assessment-results-service
              uri: ${emhare.gateway.upstream-health.services.assessment-results}
              predicates:
                - Path=/api/assessment/**,/api/results/**,/api/assessment-results/**
            - id: exams-timetabling-service
              uri: ${emhare.gateway.upstream-health.services.exams-timetabling}
              predicates:
                - Path=/api/exams/**,/api/timetabling/**
            - id: accommodation-service
              uri: ${emhare.gateway.upstream-health.services.accommodation}
              predicates:
                - Path=/api/accommodation/**
            - id: dining-service
              uri: ${emhare.gateway.upstream-health.services.dining}
              predicates:
                - Path=/api/dining/**
            - id: documents-reporting-service
              uri: ${emhare.gateway.upstream-health.services.documents-reporting}
              predicates:
                - Path=/api/documents/**,/api/reports/**
            - id: notifications-service
              uri: ${emhare.gateway.upstream-health.services.notifications}
              predicates:
                - Path=/api/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,upstreamServices

emhare:
  gateway:
    upstream-health:
      enabled: ${GATEWAY_UPSTREAM_HEALTH_ENABLED:true}
      timeout: ${GATEWAY_UPSTREAM_HEALTH_TIMEOUT:2s}
      services:
        core-identity: ${CORE_IDENTITY_SERVICE_URL:http://localhost:8081}
        academic-setup: ${ACADEMIC_SETUP_SERVICE_URL:http://localhost:8082}
        admissions: ${ADMISSIONS_SERVICE_URL:http://localhost:8083}
        finance: ${FINANCE_SERVICE_URL:http://localhost:8084}
        student-records: ${STUDENT_RECORDS_SERVICE_URL:http://localhost:8085}
        assessment-results: ${ASSESSMENT_RESULTS_SERVICE_URL:http://localhost:8086}
        exams-timetabling: ${EXAMS_TIMETABLING_SERVICE_URL:http://localhost:8087}
        accommodation: ${ACCOMMODATION_SERVICE_URL:http://localhost:8088}
        dining: ${DINING_SERVICE_URL:http://localhost:8089}
        documents-reporting: ${DOCUMENTS_REPORTING_SERVICE_URL:http://localhost:8090}
        notifications: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8091}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
