server:
  port: ${SERVER_PORT:8083}

spring:
  config:
    import: classpath:emhare-service-common.yml
  application:
    name: admissions-service
  http:
    serviceclient:
      academic-setup:
        base-url: lb://academic-setup-service
      core-identity:
        base-url: lb://core-identity-service
      documents-reporting:
        base-url: lb://documents-reporting-service
      finance:
        base-url: lb://finance-service
  datasource:
    url: ${ADMISSIONS_DATABASE_URL:jdbc:postgresql://localhost:5433/emhare_admissions}
    username: ${EMHARE_SERVICE_DB_USER:emhare_service}
    password: ${EMHARE_SERVICE_DB_PASSWORD:emhare_dev_password}

emhare:
  messaging:
    integration-enabled: true
  applicant-portal:
    public-url: ${APPLICANT_PORTAL_PUBLIC_URL:http://localhost:3001}
