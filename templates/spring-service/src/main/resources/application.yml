server:
  port: ${SERVER_PORT:0}

spring:
  application:
    name: replace-with-service-name
  config:
    import: classpath:emhare-service-foundation.yml

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://emhare-discovery:emhare-discovery-dev@localhost:8761/eureka/}
